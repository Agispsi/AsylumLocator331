name: Build and test Android locator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, lint, APK and Android test APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm
      - name: Real on-device OCR and persistence tests (rendered fixtures, not live game)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.agispsi.asylumlocator/.MainActivity
            sleep 1
            adb shell screencap -p /data/local/tmp/main-screen.png
            adb pull /data/local/tmp/main-screen.png app/build/reports/main-screen.png
      - name: Package APK and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsylumLocator331-apk-and-test-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
            app/build/reports/main-screen.png
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Publish phone-downloadable APK after tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AsylumLocator331.apk
          sha256sum AsylumLocator331.apk > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Live capture / OCR / bounded map scanner with on-phone calibration.

          Verified in this build: unit tests, Android lint, bundled ML Kit OCR on rendered Android fixtures, and evidence storage/deduplication tests.
          NOT verified: Last Asylum live-game compatibility, reliable map navigation on your phone, or a live player location. A successful build is not a live-game search test.

          Install AsylumLocator331.apk on Android 8 or newer. Allow floating controls, enable Asylum map controls in Accessibility, then grant screen capture. Calibrate Map, Sanctuary and Add Tag screens using the overlay, run Read on a known Sanctuary, then start a bounded Scan. Read README for exact limitations.
          Existing APKs signed by a different build key require uninstalling the old app first; uninstalling deletes its app-local data.
          NOTES
          gh release create "build-${GITHUB_RUN_NUMBER}" AsylumLocator331.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "Asylum Locator 0.2 • Build ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md
